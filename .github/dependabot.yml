# Keeps the pinned actions (the comment after each sha says the version) and the base image current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The Python base image in the Dockerfile (security fixes reach the image this way)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
