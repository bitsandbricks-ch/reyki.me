# Read-only: list Ingresses and HTTPRoutes in every namespace. Nothing else, no secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reyki-me
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reyki-me
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reyki-me
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reyki-me
subjects:
  - kind: ServiceAccount
    name: reyki-me
    namespace: reyki-me
