# TODO: use an ingress class / load balancer that only listens on the mesh (NetBird / Tailscale),
# never the public one. Set TLS to match the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reyki-me
spec:
  # ingressClassName: tailscale
  rules:
    - host: mesh.reyki.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reyki-me
                port: { name: http }
